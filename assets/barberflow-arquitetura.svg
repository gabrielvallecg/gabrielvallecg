<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Arquitetura do BarberFlow na AWS: o navegador acessa a EC2 pela porta 80 (Security Group). A EC2 t3.micro roda o site, a API em Node.js e o SQLite no disco EBS; no boot baixa o pacote do S3 usando uma role do IAM. E-mails saem pelo Gmail SMTP. Tudo foi criado por script no CloudShell.">
<title>Arquitetura do BarberFlow na AWS: o navegador acessa a EC2 pela porta 80 (Security Group). A EC2 t3.micro roda o site, a API em Node.js e o SQLite no disco EBS; no boot baixa o pacote do S3 usando uma role do IAM. E-mails saem pelo Gmail SMTP. Tudo foi criado por script no CloudShell.</title>
